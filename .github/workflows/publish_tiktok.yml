name: TikTok Cloud Autopublisher (4 Videos Diarios - Zero Cost)

on:
  schedule:
    # 4 Horarios Colombia UTC-5:
    - cron: '5 16 * * *'   # 11:05 AM Colombia
    - cron: '5 19 * * *'   # 02:05 PM Colombia
    - cron: '35 23 * * *'  # 06:35 PM Colombia
    - cron: '5 2 * * *'    # 09:05 PM Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restaurar credenciales TikTok
        run: |
          echo '${{ secrets.TIKTOK_COOKIES_JSON }}' > cookies.json

      - name: Publicar siguiente Short en TikTok
        run: |
          python publisher.py

      - name: Subir captura de confirmación si existe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-screenshots
          path: '*.png'
          if-no-files-found: ignore

      - name: Guardar estado de publicaciones
        if: success()
        run: |
          git config --global user.name "TikTok Cloud Bot"
          git config --global user.email "bot@tiktok-cloud.local"
          git add estado_publicaciones.json
          git commit -m "Auto: video publicado [skip ci]" || echo "Sin cambios"
          git push || echo "No se pudo hacer push"
